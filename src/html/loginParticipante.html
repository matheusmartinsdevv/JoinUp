<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../Css/login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
  <title>Login participante | JoinUp</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>

<body>
  <div class="login-page">
    <div class="cta__orbs">
      <div class="orb orb--4"></div>
      <div class="orb orb--5"></div>
    </div>
    <div class="container">
      <div class="cta__inner fade-in">
        <span class="badge"><i class="fa-solid fa-ticket"></i> Acesso participante</span>
        <h1 class="cta__title">Entre no seu<br /><span class="text-gradient">feed</span></h1>
        <p class="cta__subtitle">Veja seus ingressos, comunidades, revendas e mensagens.</p>

        <form class="cta__form glass" id="loginForm">
          <input type="email" name="email" placeholder="Seu e-mail" autocomplete="email" class="cta__input" required />
          <input type="password" name="senha" placeholder="Sua senha" autocomplete="current-password" class="cta__input" required />
          <div class="auth-feedback" id="authFeedback" aria-live="polite"></div>

          <button type="submit" class="btn btn--primary btn--glow btn--lg cta__submit">
            Entrar como participante
          </button>
        </form>

        <div class="auth-links">
          <a href="cadastroParticipante.html">Criar conta participante</a>
          <span>ou</span>
          <a href="login.html">trocar perfil</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/loginParticipante.js"></script>
</body>

</html>
